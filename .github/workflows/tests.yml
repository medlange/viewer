name: tests

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The suite reads sources and JSON -- no dependencies beyond pytest.
      - run: pip install pytest
      - run: pytest tests -q
